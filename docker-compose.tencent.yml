# 腾讯云 CVM 生产环境部署配置
# 服务器: 101.35.226.59
# 域名: bichat.matrix-ai.com.cn
# 端口: 前端 3002, 后端 8002 (避开现有服务)
# 使用方式: docker-compose -f docker-compose.tencent.yml up -d

version: '3.8'

services:
  # Frontend Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: bichat-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://bichat.matrix-ai.com.cn/api/v1
      - NEXT_PUBLIC_MINIO_ENDPOINT=https://bichat.matrix-ai.com.cn/minio
      - NEXT_PUBLIC_MINIO_BUCKET=bichat-files
      - PORT=3000
    ports:
      - "3002:3000"  # 映射到宿主机 3002，避开现有 3000
    networks:
      - bichat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Backend FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bichat-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bichat
      - MINIO_ENDPOINT=storage:9000
      - MINIO_SECURE=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PYTHONPATH=/app:/
      - ENVIRONMENT=production
      - DEBUG=false
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY:-sk-placeholder}
      - SECRET_KEY=${SECRET_KEY}
      - CLERK_JWT_PUBLIC_KEY=${CLERK_JWT_PUBLIC_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./backend:/app
      - ./Agent:/Agent
      - ./AgentV2:/AgentV2
      - /opt/bichat_data/uploads:/app/uploads
    ports:
      - "8002:8000"  # 映射到宿主机 8002，避开现有 8000, 8001
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - bichat-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: bichat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bichat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/bichat_data/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bichat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bichat-network

  # MinIO Storage Service
  storage:
    image: minio/minio:latest
    container_name: bichat-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - /opt/bichat_data/minio:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - bichat-network

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bichat-qdrant
    restart: unless-stopped
    volumes:
      - /opt/bichat_data/qdrant:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks:
      - bichat-network

networks:
  bichat-network:
    driver: bridge
