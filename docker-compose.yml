services:
  # Frontend Next.js Application
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: development
    container_name: dataagent-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8004/api/v1
      - NEXT_PUBLIC_MINIO_ENDPOINT=http://localhost:9000
      - NEXT_PUBLIC_MINIO_BUCKET=dataagent-files
      - WATCHPACK_POLLING=true
    volumes:
      - ./apps/frontend:/app
      - ./apps/frontend/node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dataagent-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Backend FastAPI Application
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: dataagent-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/dataagent
      - DATABASE_SYNC_URL=postgresql://postgres:password@db:5432/dataagent
      - MINIO_ENDPOINT=storage:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=false
      - CHROMA_HOST=vector_db
      - CHROMA_PORT=8000
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
      - CLERK_JWT_PUBLIC_KEY=${CLERK_JWT_PUBLIC_KEY}
      - CLERK_API_URL=${CLERK_API_URL:-https://api.clerk.dev}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000"]
      - LOG_LEVEL=INFO
      - ENABLE_RAG=true
      # ========== SOTA 重构配置 ==========
      - USE_SOTA_AGENT=${USE_SOTA_AGENT:-false}
      - ENABLE_SELF_HEALING=${ENABLE_SELF_HEALING:-false}
      - ENABLE_DISAMBIGUATION=${ENABLE_DISAMBIGUATION:-false}
      # 🔧 修复：添加 PYTHONPATH 使 agent 模块可以正确导入
      # 注意：需要添加根目录 / 使 import agent 能正确找到 /agent
      - PYTHONPATH=/app:/
    volumes:
      - ./apps/backend:/app
      # 挂载 Agent 目录到容器根目录，供 agent_service.py 导入 sql_agent 等模块
      # 修复：挂载到 /agent (小写) 以匹配代码中的 import agent
      - ./agent:/agent
      - ./cube_schema:/cube_schema
      # 🔧 修复：使用本地目录映射，确保上传文件持久化且易于访问
      # 如果使用命名卷 backend_uploads，文件会存储在Docker内部，不易访问
      # 改为本地目录映射后，文件直接存储在 ./data_storage 目录中
      - ./infrastructure/storage/data_storage:/app/uploads
      # 挂载本地 scripts 目录到容器内的 /app/data，供 Agent 读取本地数据文件
      - ./tools/deployment:/app/data
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
      vector_db:
        condition: service_started
    networks:
      - dataagent-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: dataagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dataagent" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataagent-network

  # MinIO Storage Service
  storage:
    image: minio/minio:latest
    container_name: dataagent-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dataagent-network

  # ChromaDB Vector Database
  vector_db:
    image: chromadb/chroma:latest
    container_name: dataagent-chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    ports:
      - "8001:8000"
    # ChromaDB镜像缺少curl，使用简单端口检查
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c ':> /dev/tcp/0.0.0.0/8000' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dataagent-network

  # MCP ECharts Server
  mcp_echarts:
    build:
      context: ./agent
      dockerfile: Dockerfile.mcp
    container_name: dataagent-mcp-echarts
    restart: unless-stopped
    ports:
      - "3033:3033"
    networks:
      - dataagent-network
    healthcheck:
      # 使用 nc 检查端口是否监听（SSE 端点会保持连接，不适合 HTTP 健康检查）
      test: [ "CMD-SHELL", "nc -z localhost 3033 || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  chroma_data:
    driver: local
  # 注意：backend_uploads 已移除，改用本地目录映射 ./data_storage:/app/uploads

networks:
  dataagent-network:
    driver: bridge
